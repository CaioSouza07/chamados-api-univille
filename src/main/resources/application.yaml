spring:
  application:
    name: chamados

  datasource:
    url: "jdbc:h2:mem:chamadosdb"
    driver-class-name: "org.h2.Driver"
    username: "sa"
    password: ""

  jpa:
    hibernate:
      ddl-auto: "update"
    show-sql: true

  # Paginação com JSON estável: { content, page: { size, number, totalElements, totalPages } }
  data:
    web:
      pageable:
        serialization-mode: "via-dto"

  h2:
    console:
      enabled: true
      path: "/h2-console"



