<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<!--
  Partes compartilhadas entre as telas.

  Uso em uma página:
    <head>
      ...
      <th:block th:replace="~{fragments/layout :: head-assets}"/>
    </head>
    <body>
      <th:block th:replace="~{fragments/layout :: icons}"/>
      <div class="app">
        <th:block th:replace="~{fragments/layout :: sidebar('categorias')}"/>
        <div class="main">
          <th:block th:replace="~{fragments/layout :: topbar}"/>
          <main class="content">...</main>
        </div>
      </div>
      <th:block th:replace="~{fragments/layout :: scripts}"/>
    </body>

  Valores aceitos em sidebar(ativo): inicio, chamados, clientes, tecnicos, categorias.
-->
<head>
  <th:block th:fragment="head-assets">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <script>
      // Define o estado do menu antes da primeira renderização (evita "piscar").
      // Desktop: lembra a última escolha. Celular: sempre começa fechado.
      (function () {
        var mobile = window.matchMedia('(max-width: 860px)').matches;
        var saved = null;
        try { saved = localStorage.getItem('sidebar'); } catch (e) {}
        if (mobile || saved === 'closed') document.documentElement.classList.add('sidebar-collapsed');
      })();
    </script>
  </th:block>
</head>
<body>

<!-- Ícones reutilizáveis -->
<svg th:fragment="icons" xmlns="http://www.w3.org/2000/svg" style="display:none">
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></symbol>
  <symbol id="i-ticket" viewBox="0 0 24 24"><path d="M3 8a2 2 0 0 0 2-2h14a2 2 0 0 0 2 2v2a2 2 0 0 0 0 4v2a2 2 0 0 0-2 2H5a2 2 0 0 0-2-2v-2a2 2 0 0 0 0-4z"/><path d="M13 6v12" stroke-dasharray="2 3"/></symbol>
  <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.5-3.5 3.2-5.5 6.5-5.5s6 2 6.5 5.5"/><path d="M16 4.7a3.5 3.5 0 0 1 0 6.6"/><path d="M18 14.8c2 .7 3.2 2.4 3.5 5.2"/></symbol>
  <symbol id="i-wrench" viewBox="0 0 24 24"><path d="M14.7 6.3a4 4 0 0 0 5 5L21 12.6 12.6 21a2.1 2.1 0 0 1-3-3L18 9.6"/><path d="M14.7 6.3L11 10"/><path d="M13 3.5l2.5 2.5"/></symbol>
  <symbol id="i-tag" viewBox="0 0 24 24"><path d="M3 12V4a1 1 0 0 1 1-1h8l9 9-9 9z"/><circle cx="8" cy="8" r="1.2"/></symbol>
  <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-inbox" viewBox="0 0 24 24"><path d="M3 13l3-8h12l3 8v6H3z"/><path d="M3 13h5l1 3h6l1-3h5"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
  <symbol id="i-hourglass" viewBox="0 0 24 24"><path d="M6 3h12M6 21h12"/><path d="M7 3c0 5 5 5 5 9s-5 4-5 9"/><path d="M17 3c0 5-5 5-5 9s5 4 5 9"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.7 2.7L16 9.8"/></symbol>
  <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9a2.1 2.1 0 0 0-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16"/><path d="M10 11v6M14 11v6"/><path d="M6 7l1 13h10l1-13"/><path d="M9 7V4h6v3"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5"/><path d="M12 16.5h.01"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14.6-4.5L4 8"/><path d="M4 4v4h4"/><path d="M4 13a8 8 0 0 0 14.6 4.5L20 16"/><path d="M20 20v-4h-4"/></symbol>
</svg>

<!-- ================= Sidebar ================= -->
<th:block th:fragment="sidebar(ativo)">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <button class="brand-mark sidebar-toggle" id="sidebar-toggle" type="button"
              aria-controls="sidebar" aria-expanded="true" aria-label="Ocultar menu lateral" title="Ocultar menu">
        <svg class="icon" aria-hidden="true"><use href="#i-menu"/></svg>
      </button>
      <a class="brand-text" th:href="@{/}">
        <span class="brand-name">Chamados</span><br>
        <span class="brand-sub">Central de atendimento</span>
      </a>
    </div>

    <nav class="nav" aria-label="Navegação principal">
      <span class="nav-label">Menu</span>
      <a class="nav-link" th:href="@{/}" th:aria-current="${ativo == 'inicio'} ? 'page'" title="Início">
        <svg class="icon" aria-hidden="true"><use href="#i-home"/></svg> <span class="nav-text">Início</span>
      </a>
      <a class="nav-link" href="#" th:aria-current="${ativo == 'chamados'} ? 'page'" title="Chamados">
        <svg class="icon" aria-hidden="true"><use href="#i-ticket"/></svg> <span class="nav-text">Chamados</span>
      </a>
      <a class="nav-link" href="#" th:aria-current="${ativo == 'clientes'} ? 'page'" title="Clientes">
        <svg class="icon" aria-hidden="true"><use href="#i-users"/></svg> <span class="nav-text">Clientes</span>
      </a>
      <a class="nav-link" th:href="@{/telas/tecnicos}" th:aria-current="${ativo == 'tecnicos'} ? 'page'" title="Técnicos">
        <svg class="icon" aria-hidden="true"><use href="#i-wrench"/></svg> <span class="nav-text">Técnicos</span>
      </a>
      <a class="nav-link" th:href="@{/telas/categorias}" th:aria-current="${ativo == 'categorias'} ? 'page'" title="Categorias">
        <svg class="icon" aria-hidden="true"><use href="#i-tag"/></svg> <span class="nav-text">Categorias</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <strong>Precisa de ajuda?</strong>
      Consulte a documentação da API em <a class="link" style="color:#fff;text-decoration:underline" th:href="@{/swagger-ui.html}">/swagger-ui.html</a>.
    </div>
  </aside>

  <div class="backdrop" id="backdrop" aria-hidden="true"></div>
</th:block>

<!-- ================= Barra superior ================= -->
<header th:fragment="topbar" class="topbar">
  <!-- Só aparece no celular, onde o menu some por completo (gaveta) -->
  <button class="menu-toggle" id="menu-toggle" type="button"
          aria-controls="sidebar" aria-expanded="true" aria-label="Abrir menu lateral">
    <svg class="icon" aria-hidden="true"><use href="#i-menu"/></svg>
  </button>
  <form class="search" role="search" onsubmit="return false">
    <svg class="icon" aria-hidden="true"><use href="#i-search"/></svg>
    <label class="sr-only" for="busca">Buscar chamados</label>
    <input id="busca" type="search" placeholder="Buscar por título, cliente ou nº do chamado">
  </form>
  <button class="btn btn-primary" type="button">
    <svg class="icon" aria-hidden="true"><use href="#i-plus"/></svg> Novo chamado
  </button>
</header>

<!-- ================= Scripts comuns ================= -->
<th:block th:fragment="scripts">
  <script th:src="@{/js/layout.js}"></script>
</th:block>

</body>
</html>
